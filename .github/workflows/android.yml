name: Android APK

# 앱은 웹(GitHub Pages)을 띄우는 방식이라 일정 수정 때마다 APK를 다시 만들 필요는 없습니다.
# 아이콘·앱 이름 등 네이티브 설정을 바꿨을 때만 Actions 탭에서 수동 실행하세요.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk fukuoka-trip.apk
          gh release create "$TAG" fukuoka-trip.apk \
            --title "안드로이드 앱 $TAG" \
            --notes "지연이와 아이들의 후쿠오카 여행 — 안드로이드 APK. 폰에서 fukuoka-trip.apk 를 받아 설치하세요. (출처를 알 수 없는 앱 설치 허용 필요)" \
            --latest
